name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NUXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests, build and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 70

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: ci-mongodb-password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint without modifying sources
        run: |
          bun run lint
          git diff --exit-code

      - name: Static safety checks
        run: |
          bun run sanity:templates
          bun run sanity:generated-template-types
          bun run sanity:embedded-runtime
          bun run sanity:zod-boundary
          bun run sanity:dependency-convergence
          bun run sanity:generated-secret-safety
          bun run sanity:source-hygiene
          bun run sanity:playwright
          bun run docs:check-human-style

      - name: Typecheck
        run: bun run typecheck

      - name: Build package
        run: bun run build

      - name: Test unit, integration and runtime end-to-end suites
        run: bun run test

      - name: Install Playwright Chromium
        run: bun run playwright:install:ci

      - name: Test browser functions with Playwright
        run: bun run test:playwright

      - name: Build docs
        run: bun run docs:build

      - name: CLI smoke and performance budgets
        run: |
          bun run cli:smoke
          bun run cli:bundle:check
          bun run cli:benchmark

      - name: Create one immutable release candidate
        run: bun run release:candidate

      - name: Certify exact candidate against PostgreSQL
        run: bun run test:postgresql:release

      - name: Certify exact candidate against MySQL and MariaDB
        run: bun run test:mysql-mariadb:release

      - name: Certify exact candidate against SQLite
        run: bun run test:sqlite:release

      - name: Certify exact candidate against Microsoft SQL Server
        run: bun run test:mssql:release

      - name: Certify exact candidate cross-database coexistence
        run: bun run test:database-matrix:release

      - name: Validate exact candidate in the production starter
        env:
          MONGODB_URL: mongodb://root:ci-mongodb-password@127.0.0.1:27017/nfz_starter_ci?authSource=admin
          NFZ_DEMO_PASSWORD: NfzStarter-Ci-2026!
        run: bun run test:starter:release

      - name: Validate exact candidate in a clean consumer
        run: bun run smoke:tarball

      - name: Promote the validated candidate to the final release artifact
        run: bun run release:finalize

      - name: Verify final release artifact
        run: bun run release:artifact:check

      - name: Verify generated tree is clean
        run: git diff --exit-code

  windows-release-smoke:
    name: Windows typecheck, build, CLI and tarball smoke
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun run install:windows

      - name: Validate Windows and security contracts
        run: |
          bun run sanity:windows-tooling
          bun run sanity:windows-install-retry
          bun run sanity:windows-install-verification
          bun run sanity:starter-release-install-resilience
          bun run sanity:dependency-convergence
          bun run sanity:file-service-template
          bun run sanity:generated-template-types
          bun run sanity:embedded-runtime
          bun run sanity:zod-boundary

      - name: Typecheck and build package
        run: |
          bun run typecheck
          bun run build

      - name: Test embedded runtime reliability
        run: bunx vitest run -c vitest.unit.config.mts test/unit/server-instance-registry.test.ts test/unit/server-bootstrap.test.ts src/runtime/options/plugins.test.ts src/runtime/templates/server/rest-bridge.test.ts src/runtime/zod/query.test.ts --no-file-parallelism --maxWorkers=1

      - name: Test packaged CLI and exact candidate in a clean consumer
        run: |
          bun run cli:smoke
          bun run release:candidate
          bun run smoke:tarball

      - name: Verify generated tree is clean
        run: git diff --exit-code
