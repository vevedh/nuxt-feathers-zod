name: Publish npm

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NUXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: --max-old-space-size=4096

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate one artifact and publish it
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: ci-mongodb-password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Use an npm CLI supporting trusted publishing
        run: npm install --global npm@^11.15.0

      - name: Verify tag, version, Git source and registry availability
        run: |
          bun run release:tag:check
          bun run release:git:check:tagged
          bun run release:check:registry

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun run playwright:install:ci

      - name: Validate source, tests, build, docs and browser behavior
        run: bun run release:check:full

      - name: Create one immutable release candidate
        run: bun run release:candidate

      - name: Certify exact candidate against PostgreSQL
        run: bun run test:postgresql:release

      - name: Certify exact candidate against MySQL and MariaDB
        run: bun run test:mysql-mariadb:release

      - name: Certify exact candidate against SQLite
        run: bun run test:sqlite:release

      - name: Certify exact candidate against Microsoft SQL Server
        run: bun run test:mssql:release

      - name: Certify exact candidate cross-database coexistence
        run: bun run test:database-matrix:release

      - name: Validate the exact candidate in the production starter
        env:
          MONGODB_URL: mongodb://root:ci-mongodb-password@127.0.0.1:27017/nfz_starter_ci?authSource=admin
          NFZ_DEMO_PASSWORD: NfzStarter-Ci-2026!
        run: bun run test:starter:release

      - name: Validate the exact candidate in a clean consumer
        run: bun run smoke:tarball

      - name: Finalize the exact validated artifact
        run: bun run release:finalize

      - name: Publish the exact validated tarball through npm trusted publishing
        run: bun run publish:npm
